<div class="min-h-screen bg-[#F8FAFB] p-6">

  @if (loading()) {
  <div class="flex flex-col gap-4 max-w-6xl mx-auto">
    <p-skeleton height="2rem" width="20%" />
    <div class="grid grid-cols-4 gap-3">
      <p-skeleton height="90px" />
      <p-skeleton height="90px" />
      <p-skeleton height="90px" />
      <p-skeleton height="90px" />
    </div>
    <p-skeleton height="160px" />
    <p-skeleton height="320px" />
  </div>
  }

  @if (!loading() && reporte()) {
  <div class="max-w-6xl mx-auto flex flex-col gap-5">

    <!-- Header -->
    <div>
      <h1 class="text-xl font-medium text-[#002E42]">Reportes y analítica</h1>
      <p class="text-xs text-[#7A96A3] mt-1">Datos en tiempo real de todos los formularios</p>
    </div>

    <!-- KPIs -->
    <reportes-kpis
      [totalRespuestas]="reporte()!.totalRespuestas"
      [totalAsignados]="reporte()!.totalAsignados"
      [totalFormularios]="reporte()!.totalFormularios"
      [tasaGlobal]="reporte()!.tasaGlobal"
    />

    <!-- Categorías -->
    <reportes-categorias
      [stats]="reporte()!.stats"
    />

    <!-- Tabla -->
    <reportes-tabla
      [stats]="reporte()!.stats"
    />

  </div>
  }

</div>
