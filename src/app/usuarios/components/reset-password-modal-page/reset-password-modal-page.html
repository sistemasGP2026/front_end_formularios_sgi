<p-toast/>
<p-dialog
  (visibleChange)="visibleChange.emit($event)"
  (onHide)="closeModal()"
  header="Resetear contraseña"
  [modal]="true"
  [(visible)]="visible"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [style]="{ width: '36rem' }"
  styleClass="rounded-2xl overflow-hidden">

  @if (user) {

  <div class="flex flex-col gap-5">

    <!-- INFO USUARIO -->
    <div class="flex items-center gap-3 p-3 rounded-xl bg-[#F8FAFB] border border-[#E6EEF2]">
      <div class="w-10 h-10 rounded-full bg-[#00649B]/10 text-[#00649B]
                  flex items-center justify-center text-sm font-bold shrink-0">
        {{ user.fullName.charAt(0).toUpperCase() }}
      </div>
      <div>
        <p class="text-sm font-semibold text-[#002E42]">{{ user.fullName }}</p>
        <p class="text-xs text-[#7A96A3]">&#64;{{ user.username }}</p>
      </div>
    </div>

    <!-- NUEVA CONTRASEÑA -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-semibold text-[#002E42]">Nueva contraseña</label>
      <p-password
        [(ngModel)]="password"
        [feedback]="true"
        [toggleMask]="true"
        placeholder="Mínimo 6 caracteres"
        styleClass="w-full"
        inputStyleClass="w-full" />
    </div>

    <!-- CONFIRMAR -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-semibold text-[#002E42]">Confirmar contraseña</label>
      <p-password
        [(ngModel)]="confirm"
        [feedback]="false"
        [toggleMask]="true"
        placeholder="Repite la contraseña"
        styleClass="w-full"
        inputStyleClass="w-full" />
    </div>

    <!-- ERROR -->
    @if (error) {
    <div class="flex items-center gap-2 rounded-xl border border-red-200 bg-red-50 px-4 py-3">
      <i class="pi pi-exclamation-circle text-red-500 text-sm"></i>
      <p class="text-sm text-red-600">{{ error }}</p>
    </div>
    }

    <!-- ACTIONS -->
    <div class="flex justify-end gap-3 pt-4 border-t border-[#E6EEF2]">
      <button
        type="button"
        (click)="closeModal()"
        class="px-4 py-2 rounded-xl border border-[#D1DCE2]
               text-sm font-medium text-[#4A6A7A]
               hover:bg-[#F4F7F9] transition cursor-pointer">
        Cancelar
      </button>

      <button
        type="button"
        (click)="reset()"
        [disabled]="saving"
        class="inline-flex items-center gap-2 px-5 py-2 rounded-xl
               bg-[#CCBA86] text-sm font-semibold text-white
               hover:opacity-90 transition cursor-pointer
               disabled:opacity-60 disabled:cursor-not-allowed">
        @if (saving) {
          <i class="pi pi-spin pi-spinner text-xs"></i>
          Guardando...
        } @else {
          <i class="pi pi-key text-xs"></i>
          Resetear contraseña
        }
      </button>
    </div>

  </div>
  }

</p-dialog>
