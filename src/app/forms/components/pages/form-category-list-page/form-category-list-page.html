<div class="mb-8">

  <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">

    <div>

      <h2 class="text-2xl font-bold text-[#002E42]">
        Seleccione el área
      </h2>

      <p class="text-sm text-[#7A96A3] mt-1">
        Elija el proceso para gestionar sus documentos.
      </p>

    </div>

    <a
      routerLink="/formularios/crear/nuevo"
      class="inline-flex items-center justify-center gap-2
             bg-[#00649B]
             hover:bg-[#00517D]
             text-white text-sm font-semibold
             px-5 py-3 rounded-xl
             shadow-sm hover:shadow-md
             transition-all duration-200">

      <i class="pi pi-plus text-xs"></i>

      Crear formulario

    </a>

  </div>

  @if (categoriasVisibles().length === 0) {

    <div class="flex flex-col items-center gap-3 py-16 text-[#7A96A3]">
      <i class="pi pi-inbox text-5xl opacity-30"></i>
      <p class="text-sm">No hay formularios disponibles</p>
    </div>

  } @else {

    <div class="max-w-5xl mx-auto">

      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">

        @for (cat of categoriasVisibles(); track cat.code) {

        <button
          [routerLink]="['/formularios/categoria', cat.code]"
          (click)="selectCategoria(cat.code)"
          class="group bg-white border border-[#E6EEF2]
                 rounded-2xl p-6 text-left
                 transition-all duration-200
                 hover:border-[#00649B]
                 hover:shadow-md">

          <div class="flex items-start justify-between">

            <div>
              <h3
                class="mt-3 text-lg font-bold text-[#002E42]
                       group-hover:text-[#00649B]">

                {{ cat.label }}

              </h3>

            </div>

            <i
              class="pi pi-arrow-right text-[#D1DCE2]
                     group-hover:text-[#00649B]">
            </i>

          </div>

        </button>

        }

      </div>

    </div>

  }

</div>
