<header class="flex items-center justify-between px-6 py-4 bg-white
               border-b border-gray-100 shadow-sm shrink-0">

  <!-- IZQUIERDA -->
  <div class="flex items-center gap-4">
    <button pButton icon="pi pi-bars" class="p-button-text p-button-plain" style="color:#002E42"
      (click)="menuToggle.emit()"></button>

    <div>
      <p class="text-lg font-semibold text-gray-700">
        Portal de evaluaciones de
        <span style="color:#002E42">Gestión Integral</span>
      </p>
    </div>
  </div>

  <!-- DERECHA -->
  <div class="flex items-center gap-3">

    <div class="flex items-center gap-2 cursor-pointer px-3 py-2 rounded-xl
             hover:bg-gray-50 transition-colors" (click)="toggleMenu(profileMenu, $event)">
      @if (currentUser) {
      <p-avatar icon="pi pi-user" shape="circle" [style]="{'background-color': '#002E42', 'color': '#fff'}" />
      <span class="text-sm font-medium hidden sm:block" style="color:#002E42">
        {{currentUser.username}}
      </span>
      }
      <i class="pi pi-chevron-down text-xs text-gray-400"></i>
    </div>

    <p-menu #profileMenu [model]="profileMenuItems" [popup]="true" />
  </div>

</header>
